name: Update Sponsors List

on:
  schedule:
    - cron: "30 2 * * *"    # Runs daily at 3:30 AM BST (02:30 UTC)
  workflow_dispatch:       # Allows manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch and convert sponsor data
        run: python scripts/fetch_sponsors.py

      - name: Commit and push if changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add public/sponsors_list.json public/last_updated.json
          git diff --staged --quiet || git commit -m "chore: update sponsors list $(date -u '+%Y-%m-%d')"
          git push
